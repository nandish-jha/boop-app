<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <h1>Boop</h1>
      <p>Sign in with Google to sync your tasks, notes, habits, and wallet from the Android app.</p>
      <button id="sign-in-btn" type="button">Sign in with Google</button>
    </div>
  </div>

  <div id="app-root" class="page hidden">
    <div class="phone">
      <header class="topbar">
        <button id="profile-btn" class="icon-btn" type="button" aria-label="Account">
          <span class="material-symbols-outlined" style="font-size:18px">person</span>
        </button>
        <div class="logo">BOOP</div>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle theme">
          <span id="theme-icon" class="material-symbols-outlined" style="font-size:18px">light_mode</span>
        </button>
      </header>

      <div id="sync-pill" class="sync-pill hidden">
        <span id="sync-status">Ready</span>
        <button id="sync-btn" type="button">Sync</button>
      </div>

      <main class="main">
        <section id="screen-home" class="screen active"></section>
        <section id="screen-notes" class="screen"></section>
        <section id="screen-reminders" class="screen"></section>
        <section id="screen-calendar" class="screen"></section>
        <section id="screen-habits" class="screen"></section>
        <section id="screen-wallet" class="screen"></section>
      </main>

      <button id="fab" class="fab" type="button" aria-label="Add">
        <span class="material-symbols-outlined" style="font-size:26px">add</span>
      </button>

      <nav class="bottom-nav" aria-label="Main">
        <button class="nav-btn active" data-screen="home" type="button">
          <span class="material-symbols-outlined">home</span>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-screen="notes" type="button">
          <span class="material-symbols-outlined">description</span>
          <span>Notes</span>
        </button>
        <button class="nav-btn" data-screen="reminders" type="button">
          <span class="material-symbols-outlined">notifications</span>
          <span>Reminders</span>
        </button>
        <button class="nav-btn" data-screen="calendar" type="button">
          <span class="material-symbols-outlined">calendar_today</span>
          <span>Calendar</span>
        </button>
        <button class="nav-btn" data-screen="habits" type="button">
          <span class="material-symbols-outlined">local_fire_department</span>
          <span>Habits</span>
        </button>
        <button class="nav-btn" data-screen="wallet" type="button">
          <span class="material-symbols-outlined">account_balance_wallet</span>
          <span>Wallet</span>
        </button>
      </nav>

      <div id="sheet-overlay" class="overlay hidden"></div>
      <div id="sheet" class="sheet hidden"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
