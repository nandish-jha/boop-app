<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141210">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Boop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <h1>Boop</h1>
      <p>Sign in with Google to sync with your phone, or use this device only until you link accounts.</p>
      <button id="sign-in-btn" type="button">Sign in with Google</button>
      <button id="guest-btn" class="ghost-btn" type="button">Continue on this device</button>
    </div>
  </div>

  <div id="app-root" class="app-root hidden">
    <nav class="side-nav" aria-label="Main">
      <div class="side-brand">Boop</div>
      <button class="nav-btn active" data-screen="home" type="button">
        <span class="material-symbols-outlined">home</span>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-screen="reminders" type="button">
        <span class="material-symbols-outlined">notifications</span>
        <span>Tasks</span>
      </button>
      <button class="nav-btn" data-screen="notes" type="button">
        <span class="material-symbols-outlined">description</span>
        <span>Notes</span>
      </button>
      <button class="nav-btn" data-screen="calendar" type="button">
        <span class="material-symbols-outlined">calendar_today</span>
        <span>Calendar</span>
      </button>
      <button class="nav-btn" data-screen="habits" type="button">
        <span class="material-symbols-outlined">local_fire_department</span>
        <span>Habits</span>
      </button>
      <button class="nav-btn" data-screen="wallet" type="button">
        <span class="material-symbols-outlined">account_balance_wallet</span>
        <span>Wallet</span>
      </button>
    </nav>

    <div class="app-body">
      <header class="topbar">
        <button id="profile-btn" class="icon-btn" type="button" aria-label="Settings">
          <span class="material-symbols-outlined">person</span>
        </button>
        <div class="logo">Boop</div>
        <div class="topbar-actions">
          <span id="sync-status" class="sync-status">Ready</span>
          <button id="sync-btn" class="sync-btn" type="button">Sync</button>
          <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle theme">
            <span id="theme-icon" class="material-symbols-outlined">light_mode</span>
          </button>
        </div>
      </header>

      <div class="search-wrap">
        <span class="material-symbols-outlined">search</span>
        <input id="search-input" type="search" placeholder="Search tasks, notes, habits, wallet…" autocomplete="off">
      </div>

      <div id="planner-switcher" class="planner-switcher hidden" role="tablist" aria-label="Planner">
        <button class="chip" data-planner="reminders" type="button">Tasks</button>
        <button class="chip" data-planner="notes" type="button">Notes</button>
        <button class="chip" data-planner="calendar" type="button">Calendar</button>
      </div>

      <main class="main">
        <section id="screen-home" class="screen active"></section>
        <section id="screen-notes" class="screen"></section>
        <section id="screen-reminders" class="screen"></section>
        <section id="screen-calendar" class="screen"></section>
        <section id="screen-habits" class="screen"></section>
        <section id="screen-wallet" class="screen"></section>
      </main>

      <button id="fab" class="fab" type="button" aria-label="Add">
        <span class="material-symbols-outlined">add</span>
      </button>

      <nav class="bottom-nav" aria-label="Main">
        <button class="nav-btn active" data-screen="home" type="button">
          <span class="material-symbols-outlined">home</span>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-screen="planner" type="button">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Planner</span>
        </button>
        <button class="nav-btn" data-screen="habits" type="button">
          <span class="material-symbols-outlined">local_fire_department</span>
          <span>Habits</span>
        </button>
        <button class="nav-btn" data-screen="wallet" type="button">
          <span class="material-symbols-outlined">account_balance_wallet</span>
          <span>Wallet</span>
        </button>
      </nav>
    </div>

    <div id="sheet-overlay" class="overlay hidden"></div>
    <div id="sheet" class="sheet hidden"></div>
    <div id="settings-panel" class="settings-panel hidden"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
